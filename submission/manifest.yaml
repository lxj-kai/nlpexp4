# 终期提交清单 — submission/build.py 读取
# 输出同步到 submission/ 根目录（src、report_final 等与仓库根同级）

include:
  - src
  - backend
  - tests
  - experiments
  - frontend
  - scripts
  - requirements.txt
  - .env.example
  - data/rgb
  - data/2wiki/en.json
  - data/2wiki/en_fact.json
  - data/2wiki/metadata.json
  - data/cmedqa/zh.json
  - data/cmedqa/zh_fact.json
  - data/cmedqa/metadata.json
  - data/mobilemem
  - data/processed
  - figures
  - report_final

exclude_globs:
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/*.py[cod]"
  - "**/.DS_Store"
  - "**/.env"
  - "**/.cache/**"
  - "**/.cache_llm/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/frontend/dist/**"
  - "**/frontend/.vite/**"
  - "**/*.aux"
  - "**/*.log"
  - "**/*.out"
  - "**/*.toc"
  - "**/*.fls"
  - "**/*.fdb_latexmk"
  - "**/*.synctex.gz"
  - "**/.texpadtmp/**"
  - "data/**/raw/**"
  - "data/miriad/**"
  - "data/bright/**"
  - "data/tempo/**"
  - "data/multihop_rag/**"
  - "data/noiser_bench/**"
  - "experiments/results/raw/**"
  - "experiments/results/*.log"
  - "report_latex/**"
  - "report/**"

# 同步到 submission/ 时保留的构建工具（不覆盖、不删除）
meta_keep:
  - build.py
  - manifest.yaml
  - sync_to_branch.sh
  - BUILD.md
  - templates
  - dist
  - .gitignore
